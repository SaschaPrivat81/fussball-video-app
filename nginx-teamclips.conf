# In C:\nginx-1.29.6\conf\nginx.conf als weiteren server-Block einfuegen.
# Zertifikatsdateinamen ggf. an deine Cloudflare-Origin-Zertifikate anpassen.

server {
    listen 80;
    server_name teamclips.de www.teamclips.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name teamclips.de www.teamclips.de;

    ssl_certificate     C:/nginx-1.29.6/ssl/teamclips.de.pem;
    ssl_certificate_key C:/nginx-1.29.6/ssl/teamclips.de.key;

    client_max_body_size 900m;

    location /_protected_media/videos/ {
        internal;
        alias C:/sites/teamclips/storage/videos/;
        sendfile on;
        etag on;
        add_header Cache-Control "private, max-age=3600, no-transform" always;
        add_header Vary "Cookie, Authorization" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Teamclips-Media-Mode "nginx-internal" always;
    }

    location /_protected_media/thumbnails/ {
        internal;
        alias C:/sites/teamclips/storage/thumbnails/;
        sendfile on;
        etag on;
        add_header Cache-Control "private, max-age=86400, no-transform" always;
        add_header Vary "Cookie, Authorization" always;
        add_header X-Teamclips-Media-Mode "nginx-internal" always;
    }

    location ~ ^/api/videos/.+/stream$ {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/videos {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
